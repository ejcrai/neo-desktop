name: Build NEO Desktop Installers (Tauri v2 · Windows, macOS, Linux)

# Plan final 2026-11-18 (T21–T22). This repository holds ONLY the compiled web (apps/web/dist), desktop/src-tauri and this
# workflow: nothing of NEO's core or of its server code (checked by a scanner before every push). The web is NOT rebuilt here.
# Each tag v* publishes a PUBLIC release (never a draft, so its downloads never 404) with:
#   the installers (.exe/.msi, universal .dmg, .AppImage/.deb), the updater's latest.json (signed with TAURI_SIGNING_PRIVATE_KEY),
#   and the same installers under fixed names, which the API's GET /v1/desktop/download/{os} redirects to.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies (WebKitGTK, keyring)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Build and publish (installers + latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/src-tauri
          tagName: v__VERSION__
          releaseName: "NEO Desktop v__VERSION__"
          releaseBody: "NEO Desktop para Windows, macOS y Linux."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  stable-names:
    needs: build-tauri
    runs-on: ubuntu-22.04
    steps:
      - name: Same installers under the fixed names the download route uses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          mkdir -p out && cd out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb'
          cp "$(ls *-setup.exe | head -1)" NEO-Desktop-Setup-x64.exe
          cp "$(ls *.dmg | head -1)" NEO-Desktop-universal.dmg
          cp "$(ls *.AppImage | head -1)" NEO-Desktop-x86_64.AppImage
          cp "$(ls *.deb | head -1)" NEO-Desktop-amd64.deb
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber NEO-Desktop-Setup-x64.exe NEO-Desktop-universal.dmg NEO-Desktop-x86_64.AppImage NEO-Desktop-amd64.deb
